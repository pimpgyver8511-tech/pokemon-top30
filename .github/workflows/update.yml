name: Preise aktualisieren

on:
  schedule:
    - cron: "17 5 * * *" # täglich ca. 07:17 Uhr deutscher Zeit
  workflow_dispatch:
  push:
    branches: [main]
    # Nur Änderungen am Datenskript lösen einen kompletten Preis-Lauf aus.
    # Reine Seitenänderungen veröffentlicht deploy.yml in ca. 1 Minute.
    paths: ["scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preise holen
        run: node scripts/update.mjs

      - name: Verlauf speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Preise $(date -u +%F)"
          # Falls inzwischen ein anderer Lauf Daten gespeichert hat: unsere frischen Daten gewinnen
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
