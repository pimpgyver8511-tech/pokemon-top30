name: Seite veröffentlichen

# Schnell: veröffentlicht Änderungen an der Seite, ohne Preise neu zu holen
on:
  push:
    branches: [main]
    paths: ["docs/**", "!docs/data/**", ".github/workflows/deploy.yml", ".github/workflows/tests.yml", "tests/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Erst testen: Schlägt ein Test fehl, bleibt die bisherige Version online
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
