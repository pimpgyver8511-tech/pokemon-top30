name: Datentest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/probe.mjs"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe.mjs
